name: Build Sound Detector Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: Apple Silicon macOS
            executable: Sound Detector
            archive: Sound Detector.dmg
            pyinstaller_args: "--onedir --windowed --icon=Contents/audio_waves.icns --osx-bundle-identifier=com.sounddetector.app"
          - runner: windows-latest
            platform: Windows
            executable: Sound Detector
            archive: Sound Detector.exe
            pyinstaller_args: "--onefile --windowed --icon=Contents/audio_waves.ico"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Contents/requirements.txt pyinstaller

      - name: Build standalone executable
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          ${{ matrix.pyinstaller_args }}
          --name "${{ matrix.executable }}"
          Contents/sound_detector.py

      - name: Add microphone permissions and package DMG (macOS)
        if: runner.os == 'macOS'
        env:
          EXECUTABLE: ${{ matrix.executable }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          cd dist

          # 1. Add microphone usage description to Info.plist
          plutil -replace NSMicrophoneUsageDescription -string "Sound Detector needs access to your microphone to detect audio." "$EXECUTABLE.app/Contents/Info.plist"

          # 2. Create entitlements.plist for audio input + Python runtime libraries
          cat << 'EOF' > entitlements.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.device.audio-input</key>
              <true/>
              <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
              <true/>
              <key>com.apple.security.cs.disable-library-validation</key>
              <true/>
          </dict>
          </plist>
          EOF

          # 3. Sign with hardened runtime and entitlements
          codesign --force --deep --options runtime --entitlements entitlements.plist --sign - "$EXECUTABLE.app"

          # 4. Package as DMG
          mkdir -p dmg_staging
          cp -R "$EXECUTABLE.app" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "$EXECUTABLE" -srcfolder dmg_staging -ov -format UDZO "$ARCHIVE"
          rm -rf dmg_staging entitlements.plist

      - name: Rename executable (Windows)
        if: runner.os == 'Windows'
        env:
          EXECUTABLE: ${{ matrix.executable }}
          ARCHIVE: ${{ matrix.archive }}
        shell: pwsh
        run: |
          Move-Item -Path "dist/$env:EXECUTABLE.exe" -Destination "dist/$env:ARCHIVE" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 30
